name: Weekly audit
on:
  schedule:
    - cron: '41 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/periodic-audit.mjs weekly "$GITHUB_SHA" > weekly-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-audit
          path: weekly-audit.json
          if-no-files-found: error
