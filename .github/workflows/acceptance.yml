name: Acceptance
on: [push, pull_request]
jobs:
  milestone-local:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: rustup show
      - run: cargo fmt --check
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run acceptance -- P12
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/
  adapter-contracts:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Rust adapter contracts
        run: cargo test --locked --test external_http --test external_observe --test external_order --test odoo_relation
      - name: Verify offline source probes
        run: >-
          node --test
          docs/references/mcp/carbon-mcp-smoke.test.mjs
          docs/references/mcp/carbon-community-smoke.test.mjs
          docs/references/mcp/odoo-sales-order-relation.test.mjs
  trace-pilot:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify trace check positive and negative cases
        id: trace
        continue-on-error: true
        run: node --test scripts/acceptance-trace.test.mjs
      - name: Report pilot outcome
        if: always()
        env:
          TRACE_OUTCOME: ${{ steps.trace.outcome }}
        run: printf "Feature trace pilot outcome for %s is %s\n" "$GITHUB_SHA" "$TRACE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
