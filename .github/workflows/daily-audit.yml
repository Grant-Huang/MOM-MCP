name: Daily audit
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: daily-audit-${{ github.event.repository.default_branch }}
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Resolve baseline and report changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/daily-audit.yml/runs" -f status=success -f branch="$GITHUB_REF_NAME" -F per_page=1 --jq '.workflow_runs[0].head_sha // ""')
          unset GH_TOKEN
          node scripts/periodic-audit.mjs daily "$GITHUB_SHA" "$base" > daily-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-audit
          path: daily-audit.json
          if-no-files-found: error
      - run: node --test scripts/acceptance-trace.test.mjs scripts/pr-risk.test.mjs scripts/periodic-audit.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run acceptance -- P9B
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-regression
          path: test-results/
