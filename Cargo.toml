[workspace]
members = [".", "crates/des", "crates/model-cnc", "crates/model-fixture", "crates/model-smt", "crates/model-assembly"]
resolver = "3"

[package]
name = "mom-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[dependencies]
mom-des = { path = "crates/des" }
mom-model-cnc = { path = "crates/model-cnc" }
mom-model-fixture = { path = "crates/model-fixture" }
mom-model-smt = { path = "crates/model-smt" }
mom-model-assembly = { path = "crates/model-assembly" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "client", "transport-io", "transport-child-process"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "time"] }

[dev-dependencies]
tempfile = "3"
